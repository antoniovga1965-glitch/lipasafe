[build]
builder = "nixpacks"
buildCommand = "cd services/api-gateway && npm install && npx prisma generate --schema=services/api-gateway/prisma/schema.prisma"

[deploy]
startCommand = "cd services/api-gateway && npx prisma migrate deploy --schema=services/api-gateway/prisma/schema.prisma && node services/api-gateway/src/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 300
